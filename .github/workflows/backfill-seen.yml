name: Backfill Seen Articles (one-time)

on:
  workflow_dispatch:   # trigger manually from the GitHub Actions tab — run once

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: daily-briefing/requirements.txt

      - name: Install dependencies
        working-directory: daily-briefing
        run: pip install -r requirements.txt

      - name: Run backfill
        working-directory: daily-briefing
        env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python backfill_seen.py

      - name: Commit updated seen_articles.json
        working-directory: daily-briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_articles.json
          git diff --cached --quiet || git commit -m "chore: backfill seen articles from Gmail history [skip ci]"
          git push
