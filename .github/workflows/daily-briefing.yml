name: Daily Recruiting Briefing

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 8:00 AM Chicago (CDT) / 7:00 AM (CST)
  workflow_dispatch:         # allow manual runs from the GitHub UI

permissions:
  contents: write            # needed to commit seen_articles.json back to the repo

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: daily-briefing/requirements.txt

      - name: Install dependencies
        working-directory: daily-briefing
        run: pip install -r requirements.txt

      - name: Run daily briefing
        working-directory: daily-briefing
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
          JSEARCH_API_KEY:    ${{ secrets.JSEARCH_API_KEY }}
          SAVE_DIR:           /tmp/daily-summaries
        run: python briefing.py

      - name: Commit seen articles and new opportunities
        working-directory: daily-briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_articles.json ../applications/summer-2027-opportunities.md
          git diff --cached --quiet || git commit -m "chore: daily update — seen articles + new opportunities [skip ci]"
          git pull --rebase origin master
            git push 
