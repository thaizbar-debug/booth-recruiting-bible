  on:                                                                                                                                                                                        
    schedule:
      - cron: '0 13 * * *'
    workflow_dispatch:
      inputs:
        dry_run:
          description: 'Dry run (print results, do not commit)'                                                                                                                              
          required: false
          default: 'false'

  permissions:
    contents: write                                                                                                                                                                          

  jobs:
    search:                                                                                                                                                                                  
      name: Search & update opportunities
      runs-on: ubuntu-latest
      timeout-minutes: 45
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'                                                                                                                                                           
            cache: 'pip'
        - run: pip install httpx duckduckgo-search
        - name: Run job search
          env:
            JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          run: python scripts/job_search.py
        - name: Commit and push
          if: ${{ github.event.inputs.dry_run != 'true' }}                                                                                                                                   
          run: |
            git config user.name "Job Search Bot"
            git config user.email "thaizbar@gmail.com"
            git add applications/summer-2027-opportunities.md
            git diff --staged --quiet && echo "No new roles today" || (
              ROLE_COUNT=$(grep -c "| New |" applications/summer-2027-opportunities.md 2>/dev/null || echo 0)
              git commit -m "[Auto] Job search $(date +%Y-%m-%d) — ${ROLE_COUNT} total New roles"
              git push
            )
