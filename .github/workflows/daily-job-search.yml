name: Daily Job Search Summer 2027

  on:
    schedule:
      - cron: '0 13 * * *'
    workflow_dispatch:

  permissions:
    contents: write

  jobs:
    search:
      runs-on: ubuntu-latest
      timeout-minutes: 45
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'
        - run: pip install httpx duckduckgo-search
        - name: Run job search
          env:
            JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          run: python scripts/job_search.py
        - name: Commit and push
          run: |
            git config user.name "Job Search Bot"
            git config user.email "thaizbar@gmail.com"
            git add applications/summer-2027-opportunities.md
            git diff --staged --quiet && echo "No changes" || git commit -m "[Auto] Job search $(date +%Y-%m-%d)" && git push
